name: Release

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Require release token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "Set RELEASE_PLEASE_TOKEN to a PAT or GitHub App token so release-created events trigger workflows." >&2
            exit 1
          fi

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-apks:
    name: publish APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    env:
      # F-Droid and this workflow build at the same project path so Flutter's
      # generated registrant URI in libapp.so stays reproducible.
      BUILD_DIR: /tmp/build
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Copy source to reproducible path
        run: |
          rm -rf "$BUILD_DIR"
          cp -a . "$BUILD_DIR"

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        working-directory: ${{ env.BUILD_DIR }}
        run: flutter pub get --enforce-lockfile

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD." >&2
            exit 1
          fi

          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/drausible-release.jks"
          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=%s\n' "$RUNNER_TEMP/drausible-release.jks"
          } > "$BUILD_DIR/android/key.properties"

      - name: Build release APKs
        working-directory: ${{ env.BUILD_DIR }}
        run: flutter build apk --release --split-per-abi

      - name: Assert split version codes
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -euo pipefail

          base_version_code="$(sed -n 's/^version:[[:space:]]*[0-9][0-9.]*+\([0-9][0-9]*\)[[:space:]]*$/\1/p' pubspec.yaml)"
          if [ -z "$base_version_code" ]; then
            echo "Could not read base versionCode from pubspec.yaml" >&2
            exit 1
          fi

          aapt2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)"
          if [ -z "$aapt2" ]; then
            echo "Could not find aapt2 under ANDROID_HOME/build-tools" >&2
            exit 1
          fi

          check_apk() {
            apk="$1"
            expected="$2"
            actual="$("$aapt2" dump badging "$apk" | sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p")"
            if [ "$actual" != "$expected" ]; then
              echo "$apk has versionCode $actual, expected $expected" >&2
              exit 1
            fi
          }

          check_apk build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "$((base_version_code * 10 + 1))"
          check_apk build/app/outputs/flutter-apk/app-x86_64-release.apk "$((base_version_code * 10 + 2))"
          check_apk build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$((base_version_code * 10 + 3))"

      - name: Stage release assets
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -euo pipefail

          version="${TAG_NAME#v}"
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "$RUNNER_TEMP/release-assets/drausible-${version}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "$RUNNER_TEMP/release-assets/drausible-${version}-x86_64.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$RUNNER_TEMP/release-assets/drausible-${version}-arm64-v8a.apk"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG_NAME" "$RUNNER_TEMP"/release-assets/*.apk --clobber

      - name: Clean signing material
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/drausible-release.jks" "$BUILD_DIR/android/key.properties"

      - name: Stamp release assets on Gridcoin
        continue-on-error: true
        uses: gridcat/gridcoin-stamp-action@653bdaa29abf87050b137a546be12a085c8657df
        # No token passed: the input defaults to github.token, which this
        # workflow already grants contents: write. Stamping needs nothing the
        # release PAT would add, and a third-party action should see the
        # narrower of the two.
        with:
          tag: ${{ needs.release-please.outputs.tag_name }}
          wait-for-confirmation: false

  release-metadata:
    name: release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-please--branches--master')

    steps:
      - name: Require release token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "Set RELEASE_PLEASE_TOKEN to a PAT or GitHub App token so this job can update the release PR branch." >&2
            exit 1
          fi

      - name: Check out release PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Update versionCode and F-Droid changelog
        run: .github/scripts/update-release-metadata.sh

      - name: Commit release metadata
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- pubspec.yaml fastlane/metadata/android/en-US/changelogs; then
            echo "Release metadata is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml fastlane/metadata/android/en-US/changelogs
          git commit -m "chore: update release metadata"
          git push origin "HEAD:${HEAD_REF}"
