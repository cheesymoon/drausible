name: CI

on:
  pull_request:
    branches:
      - dev
      - master
  push:
    branches:
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check the Flutter pin
        run: |
          set -euo pipefail

          # F-Droid's recipe reads the version straight out of release.yml, with
          # the sed from fdroiddata's templates/build-flutter.yml. That needs a
          # literal, so the pin lives both there and in .fvmrc. Catch them
          # drifting apart on the next Flutter bump.
          fvmrc="$(sed -n -E 's/.*"flutter":\s*"([^"]+)".*/\1/p' .fvmrc)"
          workflow="$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)"

          # An extra matching line would leave F-Droid with multi-line garbage
          # that its own '[[ $flutterVersion ]]' guard still lets through.
          if [ -z "$workflow" ] || [ "$(printf '%s\n' "$workflow" | wc -l)" -ne 1 ]; then
            echo "release.yml needs exactly one flutter-version: '...' line, got: $workflow" >&2
            exit 1
          fi

          if [ "$fvmrc" != "$workflow" ]; then
            echo ".fvmrc pins $fvmrc but release.yml pins $workflow" >&2
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Android APK
        run: flutter build apk --release --split-per-abi
